[project]
name = "data-driven-soc-floorplanning"
version = "0.1.0"
description = "ICCAD 2026 FloorSet SoC floorplanning solver (team cadc1013): shipped package source, training and gate tooling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.9.0",
    "numba>=0.59",
    "numpy>=1.24.0,<2.0",
    "python-dotenv>=1.0.1",
    "requests==2.32.4",
    "scipy>=1.13.0",
    "shapely==2.0.5",
    "torch>=2.0.0",
    "tqdm==4.66.4",
    "wandb>=0.18.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-s"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
